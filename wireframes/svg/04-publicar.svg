  </g>

  <text font-family="sans-serif" x="16" y="612" font-size="11" fill="black">5 campos. La vigencia la calcula la app.</text>
  <text font-family="sans-serif" x="16" y="632" font-size="11" fill="black">El organizador no la marca a mano.</text>

  <g transform="translate(0,740)">
