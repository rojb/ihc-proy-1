<svg xmlns="http://www.w3.org/2000/svg" width="375" height="420" viewBox="0 0 375 420">
  <rect width="375" height="420" fill="white" stroke="black" stroke-dasharray="4"/>

  <g transform="translate(0,0)">
    <rect width="375" height="64" fill="none" stroke="black" stroke-dasharray="4"/>
    <text font-family="sans-serif" x="16" y="32" font-size="18" fill="black">Escala de espaciado</text>
    <text font-family="sans-serif" x="16" y="50" font-size="11" fill="black">Base 8. Todas las distancias son multiplos de 8.</text>
  </g>

  <g transform="translate(16,80)">
    <rect width="343" height="56" fill="none" stroke="black"/>
    <rect x="16" y="24" width="8" height="8" fill="black"/>
    <text font-family="sans-serif" x="48" y="26" font-size="13" fill="black">8 px</text>
    <text font-family="sans-serif" x="48" y="44" font-size="11" fill="black">Etiqueta y campo. Dato y unidad.</text>
  </g>

  <g transform="translate(16,144)">
    <rect width="343" height="56" fill="none" stroke="black"/>
    <rect x="16" y="20" width="16" height="16" fill="black"/>
    <text font-family="sans-serif" x="56" y="26" font-size="13" fill="black">16 px</text>
    <text font-family="sans-serif" x="56" y="44" font-size="11" fill="black">Contenido relacionado. Margen lateral.</text>
  </g>

  <g transform="translate(16,208)">
    <rect width="343" height="56" fill="none" stroke="black"/>
    <rect x="16" y="16" width="24" height="24" fill="black"/>
    <text font-family="sans-serif" x="64" y="26" font-size="13" fill="black">24 px</text>
    <text font-family="sans-serif" x="64" y="44" font-size="11" fill="black">Entre grupos distintos de la pantalla.</text>
  </g>

  <g transform="translate(16,272)">
    <rect width="343" height="56" fill="none" stroke="black"/>
    <rect x="16" y="12" width="32" height="32" fill="black"/>
    <text font-family="sans-serif" x="72" y="26" font-size="13" fill="black">32 px</text>
    <text font-family="sans-serif" x="72" y="44" font-size="11" fill="black">Entre secciones de la tarea.</text>
  </g>

  <g transform="translate(16,344)">
    <rect width="343" height="56" fill="none" stroke="black" stroke-dasharray="4"/>
    <text font-family="sans-serif" x="16" y="24" font-size="11" fill="black">Mas cerca = se leen juntos.</text>
    <text font-family="sans-serif" x="16" y="42" font-size="11" fill="black">Mas lejos = momentos distintos de la tarea.</text>
  </g>
</svg>
