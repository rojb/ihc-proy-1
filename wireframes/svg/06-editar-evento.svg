<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812">
  <rect width="375" height="812" fill="white" stroke="black" stroke-dasharray="4"/>

  <g transform="translate(0,0)">
    <rect width="375" height="64" fill="none" stroke="black" stroke-dasharray="4"/>
    <text font-family="sans-serif" x="16" y="32" font-size="18" fill="black">Editar evento</text>
    <text font-family="sans-serif" x="16" y="50" font-size="11" fill="black">&#8592; Mis eventos</text>
  </g>

  <g transform="translate(16,80)">
    <text font-family="sans-serif" x="0" y="12" font-size="12" fill="black">Nombre del evento</text>
    <rect y="20" width="343" height="44" fill="none" stroke="black"/>
    <text font-family="sans-serif" x="12" y="48" font-size="13" fill="black">Noche de cumbia</text>
  </g>

  <g transform="translate(16,160)">
    <text font-family="sans-serif" x="0" y="12" font-size="12" fill="black">Fecha y hora</text>
    <rect y="20" width="343" height="44" fill="none" stroke="black" stroke-width="3"/>
    <text font-family="sans-serif" x="12" y="48" font-size="13" fill="black">Vie 12 sep · 22:00</text>
  </g>

  <g transform="translate(16,240)">
    <text font-family="sans-serif" x="0" y="12" font-size="12" fill="black">Precio (Bs)</text>
    <rect y="20" width="343" height="44" fill="none" stroke="black"/>
    <text font-family="sans-serif" x="12" y="48" font-size="13" fill="black">30</text>
  </g>

  <g transform="translate(16,320)">
    <text font-family="sans-serif" x="0" y="12" font-size="12" fill="black">Lugar</text>
    <rect y="20" width="343" height="44" fill="none" stroke="black"/>
    <text font-family="sans-serif" x="12" y="48" font-size="13" fill="black">La Casona, Equipetrol</text>
  </g>

  <g transform="translate(16,408)">
    <rect width="343" height="56" fill="none" stroke="black" stroke-width="3"/>
    <text font-family="sans-serif" x="171" y="34" text-anchor="middle" font-size="15" fill="black">Guardar cambios</text>
  </g>

  <g transform="translate(16,480)">
    <rect width="343" height="48" fill="none" stroke="black" stroke-dasharray="4"/>
    <text font-family="sans-serif" x="171" y="30" text-anchor="middle" font-size="13" fill="black">Cancelar evento</text>
  </g>

  <text font-family="sans-serif" x="16" y="560" font-size="11" fill="black">Al guardar, el dato queda corregido en un solo lugar.</text>
  <text font-family="sans-serif" x="16" y="580" font-size="11" fill="black">No hay que repetirlo en Instagram ni en WhatsApp.</text>

  <g transform="translate(0,740)">
    <rect width="375" height="72" fill="none" stroke="black" stroke-dasharray="4"/>
    <line x1="187" y1="0" x2="187" y2="72" stroke="black"/>
    <text font-family="sans-serif" x="94" y="42" text-anchor="middle" font-size="12" fill="black">Eventos</text>
    <text font-family="sans-serif" x="281" y="42" text-anchor="middle" font-size="12" fill="black">Publicar</text>
  </g>
</svg>
