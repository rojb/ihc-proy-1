services:
  db:
    image: postgres:17-alpine
    container_name: eventos_scz_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eventos
      POSTGRES_PASSWORD: eventos
      POSTGRES_DB: eventos_scz
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventos -d eventos_scz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
